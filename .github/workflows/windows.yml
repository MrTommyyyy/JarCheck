name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Install packaging tool
        run: python -m pip install PyInstaller==6.16.0
      - name: Build Windows executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noupx --windowed --name JarCheck gui.py
          python -m PyInstaller --noconfirm --clean --onefile --noupx --console --name JarCheck-CLI jarcheck.py
      - name: Check bundled command line
        shell: pwsh
        run: |
          $actual = & .\dist\JarCheck-CLI.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '0.3.0') { throw "Wrong bundled version: $actual" }
      - name: Test packaged behaviour
        run: python windows_smoke.py
      - name: Package portable download
        shell: pwsh
        run: |
          Copy-Item LICENSE, WINDOWS-README.txt -Destination dist
          Get-ChildItem dist\*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Compress-Archive -Path dist\* -DestinationPath JarCheck-0.3.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JarCheck-0.3.0-Windows-x64
          path: JarCheck-0.3.0-Windows-x64.zip
          if-no-files-found: error
