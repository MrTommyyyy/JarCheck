name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Install packaging tool
        run: python -m pip install PyInstaller==6.22.0
      - name: Build Windows executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noupx --windowed --name JarCheck gui.py
          python -m PyInstaller --noconfirm --clean --onefile --noupx --console --name JarCheck-CLI jarcheck.py
      - name: Check bundled command line
        shell: pwsh
        run: |
          $actual = & .\dist\JarCheck-CLI.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '0.4.0') { throw "Wrong bundled version: $actual" }
      - name: Test packaged behaviour
        run: python windows_smoke.py
      - name: Check packaged desktop startup
        shell: pwsh
        run: |
          $app = Start-Process .\dist\JarCheck.exe -PassThru
          try {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            do {
              Start-Sleep -Milliseconds 200
              $app.Refresh()
              if ($app.HasExited) { throw "Desktop exited before showing a window" }
            } while ($app.MainWindowHandle -eq 0 -and $timer.Elapsed.TotalSeconds -lt 30)
            if ($app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -notlike '*JarCheck 0.4.0*') { throw "Desktop window was not detected" }
            Write-Host "Packaged desktop opened: $($app.MainWindowTitle)"
          } finally {
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(5000)) { $app.Kill() }
            }
          }
      - name: Package portable download
        shell: pwsh
        run: |
          Copy-Item LICENSE, WINDOWS-README.txt -Destination dist
          Get-ChildItem dist\*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Compress-Archive -Path dist\* -DestinationPath JarCheck-0.4.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JarCheck-0.4.0-Windows-x64
          path: JarCheck-0.4.0-Windows-x64.zip
          if-no-files-found: error
      - name: Publish tested release downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python package_source.py JarCheck 0.4.0
          gh release view v0.4.0 --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v0.4.0 already exists; preserving published downloads."
            exit 0
          }
          gh release create v0.4.0 JarCheck-0.4.0-Windows-x64.zip JarCheck-0.4.0-Source.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "JarCheck 0.4.0" --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
